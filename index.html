<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توليد رابط التحميل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: #111111;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #222222;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        button {
            padding: 14px;
            background: #00e5ff;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="margin:0; text-align:center; color:#00e5ff;">🚀 معالجة الرابط عبر Colab</h3>
        <input type="text" id="file_name" placeholder="اسم الملف (مثال: game.apk)">
        <textarea id="source_url" rows="3" placeholder="ألصق الرابط المباشر هنا..."></textarea>
        <button onclick="sendToColab()">⚡ بدء المعالجة والرفع</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendToColab() {
            const fileName = document.getElementById('file_name').value.trim() || "app.apk";
            const sourceUrl = document.getElementById('source_url').value.trim();

            if (!sourceUrl) {
                tg.showAlert("يرجى وضع الرابط أولاً!");
                return;
            }

            // إرسال البيانات لسيرفر Colab عبر شات البوت
            tg.sendData(JSON.stringify({ file_name: fileName, source_url: sourceUrl }));
            tg.close();
        }
    </script>
</body>
</html>
