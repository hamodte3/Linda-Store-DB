<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linda Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0d0d0d;
            --border: #1e1e1e;
            --accent: #00E5FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        textarea {
            width: 100%;
            height: 140px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.15);
        }
        textarea::placeholder {
            color: #444444;
            font-size: 13px;
        }
        button.btn {
            width: 100%;
            background: var(--accent);
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25);
            transition: transform 0.1s, opacity 0.2s;
        }
        button.btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="app_url" placeholder="https://..." autofocus></textarea>
        <button class="btn" onclick="sendToBot()">⚡ ⚡ ⚡ ⚡ ⚡</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendToBot() {
            const url = document.getElementById('app_url').value.trim();
            if (!url) {
                tg.showAlert("ألصق الرابط أولاً!");
                return;
            }

            const payload = {
                source_url: url,
                auto_parse: true,
                title: null,
                category: "Tools",
                vibrant_color: "#00E5FF",
                mod_info: "",
                is_clone: false,
                clone_package: null,
                arch: "universal"
            };

            tg.sendData(JSON.stringify(payload));
            tg.close();
        }
    </script>
</body>
</html>
